services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_pw}
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    image: ${IMAGE_SERVER}
    restart: unless-stopped
    command: ["node", "dist/server.js"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app_pw}@db:5432/${POSTGRES_DB:-app_db}
    ports:
      - "3001:3001"

  client:
    image: ${IMAGE_CLIENT}
    restart: unless-stopped
    environment:
      API_URL: ${API_URL}
    ports:
      - "8080:80"

volumes:
  db_data: