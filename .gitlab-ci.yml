stages:
  - lint
  - build
  - test

# Lint the client.
lint-client:
  stage: lint
  image: node:22
  script:
    - cd client
    - npm ci
    - npm run lint

lint-server:
  stage: lint
  image: node:22
  script:
    - cd server
    - npm ci
    - npm run lint

build-client:
  stage: build
  image: node:22
  script:
    - cd client
    - npm ci
    - npm run build

build-server:
  stage: build
  image: node:22
  script:
    - cd server
    - npm ci
    - npm run build

test-server:
  stage: test
  image: node:22
  services:
    - postgres:16
  variables:
    POSTGRES_DB: app_test_db
    POSTGRES_USER: app
    POSTGRES_PASSWORD: app_pw
    PGHOST: postgres
    PGPORT: "5432"
    PGUSER: app
    PGPASSWORD: app_pw
    PGDATABASE: app_test_db
  script:
    - cd server
    - npm ci
    - npm test